spring.application.name=gateway-service

server.port=${SERVER_PORT:8080}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=personal-service
spring.cloud.gateway.server.webflux.routes[1].uri=${PERSONAL_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/personal/**

spring.cloud.gateway.server.webflux.routes[2].id=aulas-service
spring.cloud.gateway.server.webflux.routes[2].uri=${AULAS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/aulas/**

spring.cloud.gateway.server.webflux.routes[3].id=capacitacion-service
spring.cloud.gateway.server.webflux.routes[3].uri=${CAPACITACION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/capacitaciones/**

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET}